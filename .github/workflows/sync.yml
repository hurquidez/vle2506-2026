name: Update Calendar

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour.
  workflow_dispatch: # Allows you to run it manually anytime.

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log In and Fetch Calendar File
        run: |
          # 1. Request the main calendar URL to pull initial cookies and any hidden fields
          curl -s -c cookies.txt -L "https://ownerslaestancia.com" > login_page.html

          # 2. Automatically extract hidden request verification tokens if the site uses them
          TOKEN=$(grep -oP 'name="__RequestVerificationToken" type="hidden" value="\K[^"]+' login_page.html || echo "")

          # 3. Submit the credentials along with the token and cookies to download the real file
          curl -s -b cookies.txt -c cookies.txt -L \
            --data-urlencode "Username=${{ secrets.PORTAL_USER }}" \
            --data-urlencode "Password=${{ secrets.PORTAL_PASS }}" \
            --data-urlencode "__RequestVerificationToken=$TOKEN" \
            "https://ownerslaestancia.com" \
            -o your_file.ics

          # 4. Clean up temporary files
          rm -f cookies.txt login_page.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add your_file.ics
          if ! git diff --staged --quiet; then
            git commit -m "Automated calendar update from La Estancia Portal"
            git push
          else
            echo "No changes detected in calendar feed."
          fi
