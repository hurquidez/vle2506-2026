name: Update Calendar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # 👇 ADD THESE TWO LINES HERE 👇
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log In and Fetch Calendar File
        run: |
          curl -s -c cookies.txt -L "https://ownerslaestancia.com"

          curl -s -b cookies.txt -c cookies.txt -L \
            --data-urlencode "Username=${{ secrets.PORTAL_USER }}" \
            --data-urlencode "Password=${{ secrets.PORTAL_PASS }}" \
            "https://ownerslaestancia.comcabo/calendar/792?year=2026&view=quarter&q=4&handler=Ics" \
            -o your_file.ics

          rm -f cookies.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add your_file.ics
          if ! git diff --staged --quiet; then
            git commit -m "Automated calendar update from La Estancia Portal"
            git push
          else
            echo "No changes detected in calendar feed."
          fi
