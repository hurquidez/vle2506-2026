name: Update Calendar

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour.
  workflow_dispatch: # Allows you to run it manually anytime.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log In and Fetch Calendar File
        run: |
          # 1. Access the main page first to capture initial session cookies
          curl -s -c cookies.txt -L "https://ownerslaestancia.com/"

          # 2. Log in using your stored secrets, preserving the session cookies
          curl -s -b cookies.txt -c cookies.txt -L \
            --data-urlencode "Username=${{ secrets.PORTAL_USER }}" \
            --data-urlencode "Password=${{ secrets.PORTAL_PASS }}" \
            "https://ownerslaestancia.com/cabo/calendar/792?year=2026&view=quarter&q=4&handler=Ics" \
            -o your_file.ics

          # 3. Clean up the cookie file for security
          rm -f cookies.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add your_file.ics
          if ! git diff --staged --quiet; then
            git commit -m "Automated calendar update from La Estancia Portal"
            git push
          else
            echo "No changes detected in calendar feed."
          fi
